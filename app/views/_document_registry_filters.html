<form class="filters registry-filters" method="get" action="/{{ registry_kind }}">
  <input name="q" value="{{ q }}" placeholder="Организация или номер {{ registry_item_genitive }}">
  <div class="faculty-picker"><details class="faculty-multiselect" data-optional="true"><summary><span class="faculty-summary">Все факультеты</span><span class="chevron">⌄</span></summary><div class="faculty-menu"><input class="faculty-search" type="search" placeholder="Поиск факультета" autocomplete="off"><div class="faculty-options">{% for faculty in faculties %}<label data-faculty-option><input type="checkbox" name="faculty" value="{{ faculty }}" {{ 'checked' if faculty in selected_faculties }}><span>{{ faculty }}</span></label>{% endfor %}</div></div></details></div>
  <select name="status">
    <option value="">Все статусы</option>
    {% for status in statuses %}<option value="{{ status }}" {{ 'selected' if status == selected_status }}>{{ status }}</option>{% endfor %}
  </select>
  {% if registry_kind in ('contracts', 'applications') %}
    <select name="end_year">
      <option value="">Любой год окончания</option>
      {% for year in end_years %}<option value="{{ year|int }}" {{ 'selected' if selected_end_year == year|string }}>{{ year|int }}</option>{% endfor %}
    </select>
    <input type="hidden" name="urgency" value="{{ selected_urgency }}">
  {% endif %}
  <button>Фильтровать</button>
  <a class="button secondary" href="/export/{{ registry_kind }}{% if export_query %}?{{ export_query }}{% endif %}">Экспорт</a>
  {% if registry_kind in ('contracts', 'applications') %}
    <div class="urgency-filters" aria-label="Срок окончания {{ registry_item_genitive }}">
      {% for key, label in urgency_buckets %}<button type="submit" name="urgency_choice" value="{{ key }}" class="urgency-toggle urgency-{{ key }}{{ ' active' if selected_urgency == key }}" aria-pressed="{{ 'true' if selected_urgency == key else 'false' }}">{{ label }} <span>{{ urgency_counts.get(key, 0) }}</span></button>{% endfor %}
    </div>
  {% endif %}
</form>
